<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D carousel_clubs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="carousel_clubs">
            <div class="carousel_clubs-item">
                <img src="https://source.unsplash.com/600x400/?dog" alt="Slide 1">
                <div class="carousel_clubs-caption">Slide 1</div>
            </div>
            <div class="carousel_clubs-item">
                <img src="https://source.unsplash.com/600x400/?cat" alt="Slide 2">
                <div class="carousel_clubs-caption">Slide 2</div>
            </div>
            <div class="carousel_clubs-item">
                <img src="https://source.unsplash.com/600x400/?parrot" alt="Slide 3">
                <div class="carousel_clubs-caption">Slide 3</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
