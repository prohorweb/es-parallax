<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Video Parallax</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        /* Video Background - Fixed */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            z-index: -1; /* Send it to the background */
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
        }

        /* Content Area - Scrollable */
        .content {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.6);
            padding: 100px 20px;
        }

        .content h1 {
            font-size: 3rem;
            margin-bottom: 50px;
        }

        .spacer {
            height: 200vh; /* Extra scroll space */
        }
    </style>
</head>
<body>

    <!-- Fixed Video Background -->
    <div class="video-container">
        <video id="background-video" autoplay muted loop>
            <source src="https://extrasport.ru/video/bg_moution.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Scrollable Content -->
    <div class="content">
        <h1>Fixed Video with Parallax Effect</h1>
        <p>Scroll down to see the parallax effect in action.</p>
    </div>

    <div class="spacer"></div>

    <script>
        window.addEventListener("scroll", function() {
            let scrollValue = window.scrollY;
            document.getElementById("background-video").style.transform = `scale(${1 + scrollValue * 0.0005})`;
        });
    </script>

</body>
</html>
